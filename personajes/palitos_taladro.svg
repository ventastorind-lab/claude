<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#FFFFFF"/>

  <!-- piso -->
  <line x1="40" y1="520" x2="560" y2="520" stroke="#D0D5DD" stroke-width="4" stroke-linecap="round"/>

  <!-- tabla de madera -->
  <rect x="400" y="300" width="150" height="220" rx="6" fill="#E8C48A" stroke="#B88A4A" stroke-width="4"/>
  <path d="M415 330 Q470 345 535 325 M415 390 Q475 405 535 385 M415 455 Q470 470 535 450" fill="none" stroke="#C9A06A" stroke-width="3"/>

  <g stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- cabeza -->
    <circle cx="210" cy="170" r="52" fill="#FFFFFF"/>
    <!-- cuerpo -->
    <line x1="210" y1="222" x2="210" y2="380"/>
    <!-- piernas -->
    <line x1="210" y1="380" x2="160" y2="515"/>
    <line x1="210" y1="380" x2="265" y2="515"/>
    <!-- brazos hacia el taladro -->
    <polyline points="210,265 270,300 318,322"/>
    <polyline points="210,280 255,345 312,350"/>
  </g>

  <!-- casco -->
  <path d="M155 160 Q158 105 210 102 Q262 105 265 160 Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
  <rect x="146" y="152" width="128" height="14" rx="7" fill="#FFC107" stroke="#1A1A1A" stroke-width="6"/>

  <!-- cara -->
  <circle cx="220" cy="182" r="6" fill="#1A1A1A"/>
  <circle cx="242" cy="182" r="6" fill="#1A1A1A"/>
  <path d="M212 203 Q229 219 246 203" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>

  <!-- taladro -->
  <g stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round">
    <rect x="300" y="300" width="80" height="42" rx="12" fill="#E53935"/>
    <path d="M318 340 L308 385 L332 385 L340 340 Z" fill="#E53935"/>
    <rect x="304" y="383" width="34" height="16" rx="4" fill="#424242"/>
    <rect x="378" y="311" width="14" height="20" rx="3" fill="#424242"/>
  </g>
  <!-- broca + tornillo -->
  <line x1="392" y1="321" x2="404" y2="321" stroke="#616161" stroke-width="6" stroke-linecap="round"/>
  <path d="M404 312 L410 312 L410 330 L404 330 Z" fill="#212121"/>
  <path d="M410 316 L432 318 L432 324 L410 326 Z" fill="#212121"/>
  <path d="M414 315 l3 12 M420 316 l3 10 M426 317 l3 8" stroke="#757575" stroke-width="2"/>

  <!-- chispas de movimiento -->
  <g stroke="#FFC107" stroke-width="5" stroke-linecap="round">
    <line x1="440" y1="296" x2="455" y2="282"/>
    <line x1="446" y1="321" x2="466" y2="321"/>
    <line x1="440" y1="346" x2="455" y2="360"/>
  </g>

  <!-- tornillos en el piso -->
  <g fill="#212121">
    <g transform="translate(330 505) rotate(-15)"><rect x="0" y="0" width="22" height="6" rx="2"/><path d="M-6 -3 L0 0 L0 6 L-6 9 Z"/></g>
    <g transform="translate(360 512) rotate(10)"><rect x="0" y="0" width="22" height="6" rx="2"/><path d="M-6 -3 L0 0 L0 6 L-6 9 Z"/></g>
  </g>

  <!-- texto -->
  <text x="300" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1A1A1A">¡Atornilla fácil y rápido!</text>
</svg>
