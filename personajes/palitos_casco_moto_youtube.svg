<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF2FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="visera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A4256"/>
      <stop offset="0.55" stop-color="#121621"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>
    <linearGradient id="casco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F8DEB"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#fondo)"/>

  <!-- carretera -->
  <rect x="0" y="965" width="1920" height="115" fill="#3C4048"/>
  <line x1="0" y1="965" x2="1920" y2="965" stroke="#2A2D33" stroke-width="6"/>
  <g stroke="#F5F5F5" stroke-width="10" stroke-linecap="round">
    <line x1="60" y1="1025" x2="220" y2="1025"/>
    <line x1="380" y1="1025" x2="540" y2="1025"/>
    <line x1="700" y1="1025" x2="860" y2="1025"/>
    <line x1="1020" y1="1025" x2="1180" y2="1025"/>
    <line x1="1340" y1="1025" x2="1500" y2="1025"/>
    <line x1="1660" y1="1025" x2="1820" y2="1025"/>
  </g>

  <!-- personaje de palitos -->
  <g stroke="#1A1A1A" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- cuello y cuerpo -->
    <line x1="790" y1="495" x2="790" y2="760"/>
    <!-- piernas -->
    <line x1="790" y1="760" x2="715" y2="955"/>
    <line x1="790" y1="760" x2="870" y2="955"/>
    <!-- brazo saludando -->
    <polyline points="790,575 950,560 1035,445"/>
    <!-- brazo en la cintura -->
    <polyline points="790,585 715,655 775,705"/>
  </g>
  <!-- guantes -->
  <circle cx="1038" cy="438" r="20" fill="#1A1A1A"/>
  <circle cx="777" cy="707" r="17" fill="#1A1A1A"/>
  <!-- líneas de saludo -->
  <g stroke="#2F8DEB" stroke-width="9" stroke-linecap="round">
    <path d="M1075 395 Q1095 415 1090 445" fill="none"/>
    <path d="M1105 370 Q1135 410 1125 460" fill="none"/>
  </g>

  <!-- casco integral -->
  <path d="M645 410
           C 632 280 720 215 805 218
           C 905 222 968 295 962 395
           L 958 455
           C 954 490 930 505 895 505
           L 705 505
           C 668 505 648 478 646 445 Z"
        fill="url(#casco)" stroke="#1A1A1A" stroke-width="12" stroke-linejoin="round"/>
  <!-- franja del casco -->
  <path d="M700 248 C 760 222 840 220 900 248" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
  <!-- visera oscura -->
  <path d="M785 318
           C 850 304 925 314 958 342
           L 955 425
           C 905 440 835 438 778 425
           C 768 395 770 345 785 318 Z"
        fill="url(#visera)" stroke="#1A1A1A" stroke-width="10" stroke-linejoin="round"/>
  <!-- reflejo de la visera -->
  <path d="M808 340 C 850 330 895 333 925 345" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <path d="M812 362 C 835 357 855 357 872 360" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <!-- bisagra de la visera -->
  <circle cx="760" cy="372" r="16" fill="#0D47A1" stroke="#1A1A1A" stroke-width="6"/>
  <!-- mentonera / ventilación -->
  <g stroke="#0D47A1" stroke-width="7" stroke-linecap="round">
    <line x1="880" y1="465" x2="925" y2="465"/>
    <line x1="880" y1="482" x2="918" y2="482"/>
  </g>
</svg>
